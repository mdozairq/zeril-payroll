[algokit]
min_version = "v2.0.0"

[project]
type = 'backend'
name = 'payroll-api'

[project.run]
test = { commands = ['npm run test'], description = 'Run API unit/integration tests (vitest)' }
build = { commands = ['npm run build'], description = 'Compile TypeScript API' }
lint = { commands = ['npm run check-types'], description = 'Type-check API sources' }
